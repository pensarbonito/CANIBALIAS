<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Beastly&display=swap" rel="stylesheet">

<title>Canibalias</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Rubik Beastly", system-ui;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#000;
overflow:hidden;
position:relative;
cursor:pointer;
}

/* link ocupa todo */
.full-link{
position:absolute;
inset:0;
z-index:3;
}

/* TEXTO MÁSCARA */
.mask-text{
font-size: clamp(70px, 15vw, 250px);
font-weight:400;
text-align:center;
line-height:0.85;

background-image:url('https://pensarbonito.github.io/CANIBALIAS/fts/8.jpg');
background-size:cover;
background-position:center;

-webkit-background-clip:text;
background-clip:text;
color:transparent;

position:relative;
z-index:2;
pointer-events:none;
}

/* Footer */
footer {
background: #0a0a0a;
padding: 60px 20px;
border-top: 1px solid #333;
}

.footer-logos-section {
max-width:1200px;
margin:auto;
text-align:center;
}

.footer-logos {
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
}

.footer-logos img {
max-height:55px;
opacity:0.7;
}

/* MOBILE */
@media (max-width:768px){

.mask-text{
font-size: clamp(80px, 20vw, 140px);
line-height:0.9;
}

.footer-logos {
gap:15px;
}

.footer-logos img {
max-height:38px;
}

}
</style>
</head>

<body>

<section class="hero">
<a href="homec.html" class="full-link"></a>

<h1 class="mask-text">
CANIB<br>ALIAS
</h1>
</section>

<footer>
<div class="footer-logos-section">
<div class="footer-logos">
<img src="LG/LOGO1.png">
<img src="LG/LOGO2.png">
<img src="LG/LOGO3.png">
<img src="LG/LOGO4.png">
<img src="LG/LOGO5.png">
</div>
</div>
</footer>

</body>
</html>
