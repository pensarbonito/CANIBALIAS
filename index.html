<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Beastly&display=swap" rel="stylesheet">

<title>Canibalias</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Rubik Beastly", system-ui;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#000;
overflow:hidden;
position:relative;
cursor:pointer;
}

/* link ocupa todo pero sin interferir visualmente */
.full-link{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

/* TEXTO MÁSCARA */
.mask-text{
font-size: clamp(70px, 15vw, 250px);
font-weight:400;
text-align:center;
line-height:0.85;

background-image:url('https://pensarbonito.github.io/CANIBALIAS/fts/8.jpg');
background-size:110%; /* permite efecto zoom */
background-position:center;

-webkit-background-clip:text;
background-clip:text;
color:transparent;

position:relative;
z-index:2;

/* animación entrada */
opacity:0;
transform:scale(1.1);
animation:fadeZoom 1.2s ease forwards;
}

/* hover efecto */
.hero:hover .mask-text{
background-size:120%;
transition:1.5s ease;
}

/* animación */
@keyframes fadeZoom{
to{
opacity:1;
transform:scale(1);
}
}

/* Footer */
footer {
background: #0a0a0a;
padding: 60px 20px;
border-top: 1px solid #333;
}

.footer-logos-section {
max-width:1200px;
margin:auto;
text-align:center;
}

.footer-logos {
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
}

.footer-logos img {
max-height:55px;
opacity:0.7;
transition:0.3s ease;
}

.footer-logos img:hover {
opacity:1;
transform:scale(1.05);
}

/* MOBILE */
@media (max-width:768px){

.mask-text{
font-size: clamp(80px, 20vw, 140px);
line-height:0.9;
}

.footer-logos {
gap:15px;
}

.footer-logos img {
max-height:38px;
}

}
</style>
</head>

<body>

<section class="hero">
<a href="homec.html" class="full-link"></a>

<h1 class="mask-text">
CANIB<br>ALIAS
</h1>
</section>

<footer>
<div class="footer-logos-section">
<div class="footer-logos">
<img src="LG/LOGO1.png">
<img src="LG/LOGO2.png">
<img src="LG/LOGO3.png">
<img src="LG/LOGO4.png">
<img src="LG/LOGO5.png">
</div>
</div>
</footer>

</body>
</html>
